name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks (required files, links, manifest, precache, secrets)
        run: python scripts/check_static.py

      - name: Service worker syntax
        run: node --check sw.js

      - name: Bilingual README cross-links
        run: |
          set -euo pipefail
          grep -q 'README.en.md' README.md
          grep -q 'README.md' README.en.md
          echo "bilingual README links OK"
